[package]
name = "craft-vector-viewer"
version = "0.1.0"
edition = "2024"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
vectorcraft-engine = { path = "../../upstream/checkouts/vectorcraft/crates/engine" }
vectorcraft-ui-egui = { path = "../../upstream/checkouts/vectorcraft/crates/ui-egui" }
vectorcraft-svg = { path = "../../upstream/checkouts/vectorcraft/crates/svg" }
egui = "=0.37.0"
eframe = { version = "=0.37.0", default-features = false, features = ["glow", "default_fonts"] }
wasm-bindgen = "=0.2.129"
wasm-bindgen-futures = "=0.4.79"
js-sys = "=0.3.106"
web-sys = { version = "=0.3.106", features = ["HtmlCanvasElement"] }
serde_json = "1"
vectorcraft-format = { path = "../../upstream/checkouts/vectorcraft/crates/format" }
vectorcraft-doc = { path = "../../upstream/checkouts/vectorcraft/crates/doc" }
