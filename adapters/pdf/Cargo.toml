[package]
name = "craft-pdf-viewer"
version = "0.1.0"
edition = "2024"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
pdfcraft-render = { path = "../../upstream/checkouts/pdfcraft/crates/render" }
wasm-bindgen = "=0.2.129"
pdfcraft-engine = { path = "../../upstream/checkouts/pdfcraft/crates/engine" }
pdfcraft-ui-egui = { path = "../../upstream/checkouts/pdfcraft/crates/ui-egui" }
egui = "=0.36.2"
eframe = { version = "=0.36.2", default-features = false, features = ["glow", "default_fonts"] }
wasm-bindgen-futures = "=0.4.79"
js-sys = "=0.3.106"
web-sys = { version = "=0.3.106", features = ["HtmlCanvasElement"] }
serde_json = "1"
pdfcraft-fonts = { path = "../../upstream/checkouts/pdfcraft/crates/fonts" }
