[package]
name = "craft-word-viewer"
version = "0.1.0"
edition = "2024"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wordcraft-engine = { path = "../../upstream/checkouts/wordcraft/crates/engine" }
wordcraft-ui-egui = { path = "../../upstream/checkouts/wordcraft/crates/ui-egui" }
egui = "=0.36.2"
eframe = { version = "=0.36.2", default-features = false, features = ["glow", "default_fonts"] }
wasm-bindgen = "=0.2.129"
wasm-bindgen-futures = "=0.4.79"
js-sys = "=0.3.106"
web-sys = { version = "=0.3.106", features = ["HtmlCanvasElement"] }
serde_json = "1"
wordcraft-fonts = { path = "../../upstream/checkouts/wordcraft/crates/fonts" }
