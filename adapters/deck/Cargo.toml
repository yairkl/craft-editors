[package]
name = "craft-deck-viewer"
version = "0.1.0"
edition = "2024"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
deckcraft-engine = { path = "../../upstream/checkouts/deckcraft/crates/engine" }
deckcraft-mcp = { path = "../../upstream/checkouts/deckcraft/crates/mcp" }
deckcraft-ui-egui = { path = "../../upstream/checkouts/deckcraft/crates/ui-egui" }
deckcraft-pptx = { path = "../../upstream/checkouts/deckcraft/crates/pptx" }
egui = "=0.37.0"
eframe = { version = "=0.37.0", default-features = false, features = ["glow", "default_fonts"] }
wasm-bindgen = "=0.2.129"
wasm-bindgen-futures = "=0.4.79"
js-sys = "=0.3.106"
web-sys = { version = "=0.3.106", features = ["HtmlCanvasElement"] }
serde_json = "1"
deckcraft-fonts = { path = "../../upstream/checkouts/deckcraft/crates/fonts" }
