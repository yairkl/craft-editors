name: CI
on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run fixtures:check
      - run: xvfb-run -a npm run test:integration
  rendering:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run upstream:fetch
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin/wasm-bindgen*
            ~/.cargo/.crates*
            adapters/target
          key: rendering-${{ runner.os }}-rust-1.95.0-${{ hashFiles('adapters/Cargo.lock', 'upstream/manifest.json') }}
      - run: rustup toolchain install 1.95.0 --profile minimal --component rustfmt,clippy --target wasm32-unknown-unknown
      - run: cargo +1.95.0 install wasm-bindgen-cli --version 0.2.129 --locked
      - run: cargo +1.95.0 fmt --manifest-path adapters/grid/Cargo.toml -p craft-grid-viewer -p craft-pdf-viewer --check
      - run: cargo +1.95.0 clippy --manifest-path adapters/Cargo.toml --locked --target wasm32-unknown-unknown --no-deps -- -D warnings
      - run: npm run renderers:build
      - run: xvfb-run -a npm run test:rendering
      - run: xvfb-run -a npm run test:editing
      - run: npm run package
      - run: npm run packages:check
      - run: xvfb-run -a npm run test:installed
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: rendering-screenshots
          path: artifacts/rendering/*.png
          if-no-files-found: ignore
          retention-days: 1
      - uses: actions/upload-artifact@v4
        if: success() && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        with:
          name: craft-release-vsix-${{ github.ref_name }}
          path: dist/vsix/*.vsix
          retention-days: 90
