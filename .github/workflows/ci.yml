name: CI
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Require a version tag for releases
        if: github.event_name == 'workflow_dispatch'
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          test "$REF_TYPE" = tag
          [[ "$REF_NAME" == v* ]]
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run fixtures:check
      - run: xvfb-run -a npm run test:integration
  rendering:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run upstream:fetch
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin/wasm-bindgen*
            ~/.cargo/.crates*
            adapters/target
          key: rendering-${{ runner.os }}-rust-1.95.0-${{ hashFiles('adapters/Cargo.lock', 'upstream/manifest.json') }}
          restore-keys: rendering-${{ runner.os }}-rust-1.95.0-
      - run: rustup toolchain install 1.95.0 --profile minimal --component rustfmt,clippy --target wasm32-unknown-unknown
      - run: cargo +1.95.0 install wasm-bindgen-cli --version 0.2.129 --locked
      - run: cargo +1.95.0 fmt --manifest-path adapters/grid/Cargo.toml -p craft-grid-viewer -p craft-pdf-viewer -p craft-word-viewer -p craft-deck-viewer -p craft-vector-viewer --check
      - run: rustfmt +1.95.0 --edition 2024 --check adapters/native/runtime.rs adapters/native/fonts.rs
      - run: cargo +1.95.0 clippy --manifest-path adapters/Cargo.toml --locked --target wasm32-unknown-unknown --no-deps -- -D warnings
      - run: rustc +1.95.0 --edition 2024 --test adapters/grid/src/wheel.rs -o "$RUNNER_TEMP/wheel-tests" && "$RUNNER_TEMP/wheel-tests"
      - run: npm run renderers:build
      - run: xvfb-run -a npm run test:rendering
      - run: xvfb-run -a npm run test:editing
      - run: xvfb-run -a npm run test:office
        if: github.event_name == 'workflow_dispatch'
      - run: xvfb-run -a npm run test:languages
        if: github.event_name == 'workflow_dispatch'
      - run: xvfb-run -a npm run test:graphics
        if: github.event_name == 'workflow_dispatch'
      - run: xvfb-run -a npm run test:theme
        if: github.event_name == 'workflow_dispatch'
      - run: npm run package
      - run: npm run packages:check
      - run: xvfb-run -a npm run test:installed
        if: github.event_name == 'workflow_dispatch'
      - name: Test Remote SSH
        if: github.event_name == 'workflow_dispatch'
        env:
          VSCODE_EXECUTABLE_PATH: ${{ github.workspace }}/.vscode-test/vscode-linux-x64-1.102.0/code
          CRAFT_REMOTE_SSH_VERSION: '0.120.0'
        run: xvfb-run -a npm run test:remote
      - run: npm run release:checksums
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: rendering-screenshots
          path: artifacts/rendering/*.png
          if-no-files-found: ignore
          retention-days: 1
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: craft-vsix-${{ github.run_id }}
          path: |
            dist/vsix/*.vsix
            dist/vsix/SHA256SUMS
          retention-days: 1

  publish-release:
    needs: rendering
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: craft-vsix-${{ github.run_id }}
          path: release-assets
      - name: Verify installer checksums
        working-directory: release-assets
        run: sha256sum --check SHA256SUMS
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          release_notes="docs/releases/${RELEASE_TAG}.md"
          test -f "$release_notes"
          prerelease=()
          if [[ "$RELEASE_TAG" == *-* ]]; then prerelease+=(--prerelease); fi
          gh release create "$RELEASE_TAG" release-assets/*.vsix release-assets/SHA256SUMS \
            --verify-tag "${prerelease[@]}" --title "Craft for VS Code $RELEASE_TAG" --notes-file "$release_notes"
