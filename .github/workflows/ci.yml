name: CI
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.select.outputs.code }}
      fixtures: ${{ steps.select.outputs.fixtures }}
      build: ${{ steps.select.outputs.build }}
      wheel: ${{ steps.select.outputs.wheel }}
      remote_script: ${{ steps.select.outputs.remote_script }}
      platform: ${{ steps.select.outputs.platform }}
      extended: ${{ steps.select.outputs.extended }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python3 scripts/test-ci-changes.py
      - id: select
        if: github.event_name == 'pull_request'
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: python3 scripts/ci-changes.py
  check:
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - name: Require a version tag for releases
        if: github.event_name == 'workflow_dispatch'
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          test "$REF_TYPE" = tag
          [[ "$REF_NAME" == v* ]]
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.code == 'true' || needs.changes.outputs.remote_script == 'true'
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.fixtures == 'true'
        with:
          python-version: '3.12'
      - run: npm ci
        if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.code == 'true'
      - run: npm run check
        if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.code == 'true'
      - run: npm test
        if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.code == 'true'
      - run: npm run fixtures:check
        if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.fixtures == 'true'
      - run: node --check scripts/test-remote-ssh.cjs
        if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.remote_script == 'true'
      - run: xvfb-run -a npm run test:integration
        if: github.event_name == 'workflow_dispatch'
  rendering:
    needs: [changes, check]
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.build == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run upstream:fetch
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin/wasm-bindgen*
            ~/.cargo/.crates*
            adapters/target
          key: rendering-${{ runner.os }}-rust-1.95.0-${{ hashFiles('adapters/Cargo.lock', 'upstream/manifest.json') }}
          restore-keys: rendering-${{ runner.os }}-rust-1.95.0-
      - run: rustup toolchain install 1.95.0 --profile minimal --component rustfmt,clippy --target wasm32-unknown-unknown
      - run: cargo +1.95.0 install wasm-bindgen-cli --version 0.2.129 --locked
      - run: cargo +1.95.0 fmt --manifest-path adapters/grid/Cargo.toml -p craft-grid-viewer -p craft-pdf-viewer -p craft-word-viewer -p craft-deck-viewer -p craft-vector-viewer --check
        if: github.event_name == 'workflow_dispatch'
      - run: rustfmt +1.95.0 --edition 2024 --check adapters/native/runtime.rs adapters/native/fonts.rs
        if: github.event_name == 'workflow_dispatch'
      - run: cargo +1.95.0 clippy --manifest-path adapters/Cargo.toml --locked --target wasm32-unknown-unknown --no-deps -- -D warnings
        if: github.event_name == 'workflow_dispatch'
      - run: rustc +1.95.0 --edition 2024 --test adapters/grid/src/wheel.rs -o "$RUNNER_TEMP/wheel-tests" && "$RUNNER_TEMP/wheel-tests"
        if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.wheel == 'true'
      - run: npm run renderers:build
      - name: Install Linux keyboard test tools
        if: github.event_name == 'workflow_dispatch'
        run: sudo apt-get update && sudo apt-get install -y xdotool xclip
      - run: xvfb-run -a npm run test:rendering
        if: github.event_name == 'workflow_dispatch'
      - run: xvfb-run -a npm run test:editing
        if: github.event_name == 'workflow_dispatch'
      - run: xvfb-run -a npm run test:office
        if: github.event_name == 'workflow_dispatch'
      - run: xvfb-run -a npm run test:languages
        if: github.event_name == 'workflow_dispatch'
      - run: xvfb-run -a npm run test:graphics
        if: github.event_name == 'workflow_dispatch'
      - run: xvfb-run -a npm run test:theme
        if: github.event_name == 'workflow_dispatch'
      - run: npm run package
      - run: npm run packages:check
      - run: xvfb-run -a npm run test:installed
        if: github.event_name == 'workflow_dispatch'
      - name: Test Remote SSH
        if: github.event_name == 'workflow_dispatch'
        env:
          VSCODE_EXECUTABLE_PATH: ${{ github.workspace }}/.vscode-test/vscode-linux-x64-1.102.0/code
          CRAFT_REMOTE_SSH_VERSION: '0.120.0'
        run: xvfb-run -a npm run test:remote
      - run: npm run release:checksums
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: rendering-screenshots
          path: artifacts/rendering/*.png
          if-no-files-found: ignore
          retention-days: 1
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: craft-vsix-${{ github.run_id }}
          path: |
            dist/vsix/*.vsix
            dist/vsix/SHA256SUMS
          retention-days: 1

  platform-smoke:
    needs: [changes, rendering]
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.platform == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: craft-vsix-${{ github.run_id }}
          path: dist/vsix
      - run: python scripts/unpack-test-renderers.py
      - name: Install Linux keyboard test tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xdotool xclip
      - name: Platform smoke (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:platform
      - name: Platform smoke (macOS and Windows)
        if: runner.os != 'Linux'
        run: npm run test:platform
      - name: Renderer and history regression suites (Linux)
        if: github.event_name == 'pull_request' && needs.changes.outputs.extended == 'true' && runner.os == 'Linux'
        run: |
          xvfb-run -a npm run test:rendering
          xvfb-run -a npm run test:office
          xvfb-run -a npm run test:graphics
      - name: Renderer and history regression suites (macOS and Windows)
        if: github.event_name == 'pull_request' && needs.changes.outputs.extended == 'true' && runner.os != 'Linux'
        shell: bash
        run: |
          set -e
          npm run test:rendering
          npm run test:office
          npm run test:graphics
      - name: Full platform suites
        if: github.event_name == 'workflow_dispatch' && runner.os != 'Linux'
        shell: bash
        run: |
          set -e
          npm run test:integration
          npm run test:rendering
          npm run test:editing
          npm run test:office
          npm run test:languages
          npm run test:graphics
          npm run test:theme
          npm run test:installed
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: platform-screenshots-${{ matrix.os }}
          path: artifacts/platform/*.png
          if-no-files-found: ignore
          retention-days: 1

  publish-release:
    needs: [rendering, platform-smoke]
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: craft-vsix-${{ github.run_id }}
          path: release-assets
      - name: Verify installer checksums
        working-directory: release-assets
        run: sha256sum --check SHA256SUMS
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          release_notes="docs/releases/${RELEASE_TAG}.md"
          test -f "$release_notes"
          prerelease=()
          if [[ "$RELEASE_TAG" == *-* ]]; then prerelease+=(--prerelease); fi
          gh release create "$RELEASE_TAG" release-assets/*.vsix release-assets/SHA256SUMS \
            --verify-tag "${prerelease[@]}" --title "Craft for VS Code $RELEASE_TAG" --notes-file "$release_notes"
